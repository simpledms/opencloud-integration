# Merge additional_policies with any existing proxy.yaml configuration.
additional_policies:
  - name: default
    routes:
      # Regex routes precede OpenCloud's existing /apps/ prefix route.
      - type: regex
        endpoint: ^/apps/simpledms_integration/
        backend: http://simpledms-integration:8080
        # Downloads need public access. POST authentication is performed by
        # the companion itself, using the forwarded OAuth bearer token.
        unprotected: true
